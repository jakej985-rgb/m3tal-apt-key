name: Package Retention & Pruning (Phase 10)

on:
  schedule:
    # Run audit weekly at 03:00 UTC on Sunday
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: "Retention Action to Execute"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "inventory"
          - "dry-run"
          - "execute"
      create_snapshot:
        description: "Create state snapshot manifest"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  retention-audit-and-prune:
    name: Package Retention Engine
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.prune.outputs.commit_sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnupg
          python3 -m pip install --upgrade pip pyyaml

      - name: Configure GPG Signing Key
        if: github.event.inputs.action == 'execute'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY || secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error ::No GPG private key configured; refusing to modify repository metadata."
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Run Retention Unit & Integration Tests
        run: |
          python3 scripts/test_retention.py

      - name: Audit Repository Package Inventory
        run: |
          python3 scripts/manage_retention.py inventory --json inventory-report.json

      - name: Upload Inventory Report
        uses: actions/upload-artifact@v4
        with:
          name: package-inventory-report
          path: inventory-report.json

      - name: Evaluate Prune Candidates (Dry-Run)
        if: github.event.inputs.action != 'execute'
        run: |
          python3 scripts/manage_retention.py prune --dry-run

      - name: Execute pruning, validate, and push with conflict retries
        if: github.event.inputs.action == 'execute'
        id: prune
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE || secrets.GPG_PASSPHRASE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/manage_retention.py prune --execute
            python3 scripts/validate_repository.py --strict --skip-container-test
            git add pool/ dists/ snapshots/ config/
            if [ -d archive ]; then git add archive/; fi
            if git diff --staged --quiet; then
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore(retention): prune obsolete package builds and regenerate indexes [skip ci]"
            if git push origin HEAD:main; then
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push raced with another writer; retrying from latest main (attempt $attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "::error ::Could not publish retention changes after five fresh-checkout attempts."
          exit 1

  validate-and-deploy:
    if: github.event.inputs.action == 'execute'
    needs: [retention-audit-and-prune]
    uses: ./.github/workflows/ci-validation.yml
    with:
      ref: ${{ needs.retention-audit-and-prune.outputs.commit_sha }}
    secrets: inherit
