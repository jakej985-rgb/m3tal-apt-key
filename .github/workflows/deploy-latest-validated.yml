name: Deploy Latest Validated APT Repository

on:
  repository_dispatch:
    types: [deploy-latest]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  pages: write
  id-token: write

# Dispatches are interchangeable wake-ups. Each worker resolves the latest main
# commit and its validation status after it acquires this group, so replacing a
# pending wake-up cannot discard a particular commit's deployment request.
concurrency:
  group: apt-pages-reconciliation
  cancel-in-progress: false

jobs:
  deploy-latest:
    name: Deploy latest validated main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest main commit
        id: target
        run: |
          git fetch origin main
          TARGET_SHA=$(git rev-parse FETCH_HEAD)
          git checkout --detach "$TARGET_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Confirm exact commit passed repository validation
        id: validation
        uses: actions/github-script@v7
        with:
          script: |
            const sha = "${{ steps.target.outputs.sha }}";
            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            const passed = statuses.some(status =>
              status.context === "apt-repository-validation" && status.state === "success"
            );
            core.setOutput("validated", String(passed));
            if (!passed) core.info(`Skipping ${sha}: no successful validation status exists.`);

      - name: Confirm main has not advanced
        id: current
        if: steps.validation.outputs.validated == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git fetch origin main
          CURRENT_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Main advanced to $CURRENT_SHA; a later validation will wake the worker again."
          fi

      - name: Configure Pages
        if: steps.validation.outputs.validated == 'true' && steps.current.outputs.current == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact from validated commit
        if: steps.validation.outputs.validated == 'true' && steps.current.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy repository to GitHub Pages
        if: steps.validation.outputs.validated == 'true' && steps.current.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public repository after deployment
        if: steps.validation.outputs.validated == 'true' && steps.current.outputs.current == 'true'
        env:
          GITHUB_SHA: ${{ steps.target.outputs.sha }}
        run: python3 scripts/verify_deployed_repository.py --base-url "${{ steps.deployment.outputs.page_url }}"
