      section: "sound"
      priority: "optional"
      maintainer: "M3tal-Creates <jakej985@gmail.com>"
      homepage: "https://jakej985-rgb.github.io/M3tal-Hub/apps/red-music-locker.html"
      description: |
        Personal cloud audio locker and YouTube Music sync daemon
        Allows self-hosted audio streaming, playlist caching, and library synchronisation.
    dependencies:
      runtime:
